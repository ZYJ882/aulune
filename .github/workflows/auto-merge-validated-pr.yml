name: Auto-merge validated pull requests

on:
  workflow_run:
    workflows: ["Android build and safe release"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    name: Merge successful internal pull request
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    steps:
      - name: Confirm merge eligibility
        id: eligibility
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          pr_json="$(gh pr view "$PR_NUMBER" --repo "${GITHUB_REPOSITORY}" --json state,isDraft,mergeStateStatus,headRepositoryOwner)"
          state="$(jq -r '.state' <<< "$pr_json")"
          draft="$(jq -r '.isDraft' <<< "$pr_json")"
          merge_state="$(jq -r '.mergeStateStatus' <<< "$pr_json")"
          head_owner="$(jq -r '.headRepositoryOwner.login // empty' <<< "$pr_json")"
          if [[ "$state" != "OPEN" || "$draft" != "false" || "$head_owner" != "$REPOSITORY_OWNER" ]]; then
            echo "merge=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$merge_state" != "CLEAN" && "$merge_state" != "UNSTABLE" ]]; then
            echo "merge=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "merge=true" >> "$GITHUB_OUTPUT"

      - name: Squash merge pull request
        if: steps.eligibility.outputs.merge == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        shell: bash
        run: |
          gh pr merge "$PR_NUMBER" --repo "${GITHUB_REPOSITORY}" --squash --delete-branch
